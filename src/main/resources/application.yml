spring:
  application:
    name: guias-app
  datasource:
    url: jdbc:h2:mem:guiasdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  storage:
    temp-path: ./guias-temp